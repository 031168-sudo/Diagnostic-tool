name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DiagnosticTool-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      # Дизайн-сборки ветки diagnostic-sync публикуются как pre-release с APK
      - name: Publish design build as pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic-sync'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="design-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "AlfaDiag-${TAG}.apk"
          gh release create "$TAG" "AlfaDiag-${TAG}.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Design build ${{ github.run_number }}" \
            --notes "Коммит ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

